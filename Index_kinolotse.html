<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b09">
<meta name="description" content="Kinolotse 12 – Suchagent mit Selbsttest, Player und Downloadverwaltung">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Kinolotse 12</title>
<style>
:root{
  --bg:#070b09;
  --bg2:#0d1410;
  --bg3:#121b16;
  --bg4:#18241d;
  --line:#1e2b23;
  --line2:#2b3d32;
  --line3:#3a5142;
  --fg:#e6f2ea;
  --fg2:#9db3a7;
  --fg3:#6d8478;
  --acc:#25d07a;
  --acc2:#1cb96c;
  --warn:#e0b23c;
  --err:#e2604f;
  --rad:12px;
  --rad2:8px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
}
body{
  background:var(--bg);
  color:var(--fg);
  min-height:100vh;
  overflow-x:hidden;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:240px;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{
  margin:0 0 .5em;
  line-height:1.25;
  font-weight:650;
}
h1{font-size:1.5rem}
h2{font-size:1.12rem}
h3{
  font-size:.9rem;
  color:var(--fg2);
  text-transform:uppercase;
  letter-spacing:.09em;
  font-weight:600;
}
h4{
  font-size:.85rem;
  color:var(--fg2);
  margin-bottom:.4em;
}
p{margin:0 0 .8em}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
code{
  font-family:var(--mono);
  font-size:.85em;
  background:var(--bg3);
  padding:1px 5px;
  border-radius:5px;
  border:1px solid var(--line);
}
hr{
  border:0;
  border-top:1px solid var(--line);
  margin:16px 0;
}
header{
  position:sticky;
  top:0;
  z-index:40;
  background:#070b09f2;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px 14px 0;
}
.kopf{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.logo{
  width:30px;
  height:30px;
  border-radius:9px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  font-weight:800;
  color:#04140c;
  font-size:15px;
  background:radial-gradient(circle at 30% 25%,#2ee98b,#0d7a47 70%);
  box-shadow:0 0 0 1px #2ee98b40;
}
.kopf h1{
  font-size:1.05rem;
  margin:0;
}
.kopf .ver{
  margin-left:auto;
  font-family:var(--mono);
  font-size:.68rem;
  color:var(--fg3);
  border:1px solid var(--line);
  border-radius:6px;
  padding:2px 6px;
}
nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:10px;
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;
  background:var(--bg2);
  color:var(--fg2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 13px;
  font-size:.82rem;
  font-weight:550;
  cursor:pointer;
  white-space:nowrap;
  font-family:inherit;
  transition:background .15s,color .15s;
}
nav button.active{
  background:var(--acc);
  color:#04140c;
  border-color:var(--acc);
}
nav button:active{transform:scale(.96)}
main{
  padding:16px 14px 0;
  max-width:860px;
  margin:0 auto;
}
.page{display:none}
.page.on{
  display:block;
  animation:ein .18s ease;
}
@keyframes ein{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:none}
}
.feld{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
input[type=text],
input[type=password],
input[type=number],
input[type=url],
select,
textarea{
  width:100%;
  background:var(--bg2);
  color:var(--fg);
  border:1px solid var(--line2);
  border-radius:10px;
  padding:11px 12px;
  font-size:.95rem;
  font-family:inherit;
}
input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--acc);
  box-shadow:0 0 0 3px #25d07a1f;
}
textarea{
  resize:vertical;
  min-height:90px;
  font-family:var(--mono);
  font-size:.78rem;
}
label.zeile{
  display:block;
  margin-bottom:12px;
}
label.zeile>span{
  display:block;
  font-size:.78rem;
  color:var(--fg2);
  margin-bottom:5px;
  font-weight:550;
}
button.btn{
  background:var(--acc);
  color:#04140c;
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-size:.9rem;
  font-weight:650;
  cursor:pointer;
  font-family:inherit;
  transition:transform .12s,opacity .12s;
}
button.btn:active{transform:scale(.97)}
button.btn[disabled]{
  opacity:.5;
  cursor:default;
  transform:none;
}
button.btn.ghost{
  background:var(--bg2);
  color:var(--fg);
  border:1px solid var(--line2);
}
button.btn.rot{
  background:var(--err);
  color:#1a0603;
}
button.btn.klein{
  padding:6px 10px;
  font-size:.78rem;
  border-radius:8px;
}
.karte{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--rad);
  padding:13px;
  margin-bottom:10px;
}
.karte .t b{
  display:block;
  font-size:.98rem;
  font-weight:600;
  word-break:break-word;
}
.karte .meta{
  font-size:.75rem;
  color:var(--fg3);
  margin-top:3px;
  font-family:var(--mono);
}
.pille{
  display:inline-block;
  font-size:.7rem;
  font-family:var(--mono);
  padding:2px 7px;
  border-radius:999px;
  border:1px solid var(--line2);
  color:var(--fg2);
  margin-right:5px;
}
.pille.gut{
  color:var(--acc);
  border-color:#25d07a55;
  background:#25d07a12;
}
.pille.mittel{
  color:var(--warn);
  border-color:#e0b23c55;
  background:#e0b23c12;
}
.pille.schlecht{
  color:var(--err);
  border-color:#e2604f55;
  background:#e2604f12;
}
.hoster{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px;
}
.hoster a,
.hoster span.lnk{
  font-size:.78rem;
  padding:7px 11px;
  border-radius:var(--rad2);
  background:var(--bg3);
  border:1px solid var(--line2);
  color:var(--fg);
  display:inline-flex;
  align-items:center;
  gap:5px;
  cursor:pointer;
}
.hoster a b{color:var(--acc);font-weight:600}
.hoster a.mp4{
  border-color:var(--acc);
  background:#25d07a18;
  color:#c8f7dd;
}
.leer{
  text-align:center;
  color:var(--fg3);
  padding:26px 12px;
  font-size:.88rem;
}
#banner{
  border-radius:10px;
  padding:10px 12px;
  font-size:.8rem;
  margin-bottom:14px;
  border:1px solid var(--line2);
  background:var(--bg2);
  color:var(--fg2);
  font-family:var(--mono);
  line-height:1.5;
}
#banner.gut{
  border-color:#25d07a55;
  background:#25d07a0e;
  color:#a9f2cb;
}
#banner.schlecht{
  border-color:#e2604f55;
  background:#e2604f0e;
  color:#f6b6ac;
}
#banner.warn{
  border-color:#e0b23c55;
  background:#e0b23c0e;
  color:#f0d59a;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:.78rem;
  font-family:var(--mono);
}
th,td{
  text-align:left;
  padding:6px 5px;
  border-bottom:1px solid var(--line);
}
th{
  color:var(--fg3);
  font-weight:600;
  font-size:.7rem;
  text-transform:uppercase;
  letter-spacing:.05em;
}
td.w{
  color:var(--fg2);
  word-break:break-word;
}
footer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:45;
  background:#060a08f5;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.kopfkonsole{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 12px;
  border-bottom:1px solid var(--line);
  font-size:.72rem;
  font-family:var(--mono);
  color:var(--fg3);
}
.kopfkonsole .p{
  display:flex;
  align-items:center;
  gap:5px;
}
.kopfkonsole .p i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--acc);
  display:inline-block;
}
.kopfkonsole .p.b i{background:var(--err)}
.kopfkonsole button{
  margin-left:auto;
  background:none;
  border:1px solid var(--line2);
  color:var(--fg3);
  border-radius:6px;
  padding:2px 8px;
  font-size:.7rem;
  cursor:pointer;
  font-family:var(--mono);
}
#konsole{
  height:130px;
  overflow-y:auto;
  padding:6px 12px;
  font-family:var(--mono);
  font-size:.72rem;
  line-height:1.5;
}
#konsole .z{
  display:flex;
  gap:7px;
  padding:1px 0;
  word-break:break-word;
}
#konsole .z time{
  color:var(--fg3);
  flex:0 0 auto;
}
#konsole .z.i{color:var(--fg2)}
#konsole .z.o{color:var(--acc)}
#konsole .z.w{color:var(--warn)}
#konsole .z.e{color:var(--err)}
#toast{
  position:fixed;
  left:50%;
  bottom:200px;
  transform:translate(-50%,20px);
  background:#e6f2ea;
  color:#070b09;
  font-size:.82rem;
  font-weight:600;
  padding:10px 16px;
  border-radius:999px;
  z-index:60;
  opacity:0;
  pointer-events:none;
  transition:.22s;
  max-width:88vw;
  text-align:center;
}
#toast.on{
  opacity:1;
  transform:translate(-50%,0);
}
.hinweis{
  font-size:.78rem;
  color:var(--fg3);
  line-height:1.5;
}
.reihe{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.reihe button{flex:1 1 auto}
.box{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--rad);
  padding:13px;
  margin-bottom:12px;
}
.trenner{
  height:1px;
  background:var(--line);
  margin:14px 0;
}
.balken{
  height:8px;
  background:var(--bg3);
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden;
  margin:8px 0;
}
.balken i{
  display:block;
  height:100%;
  width:0;
  background:var(--acc);
  transition:width .12s;
}
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:12px;
}
.chips button{
  font-size:.76rem;
  padding:5px 10px;
  border-radius:999px;
  background:var(--bg3);
  border:1px solid var(--line2);
  color:var(--fg2);
  cursor:pointer;
  font-family:inherit;
}
.chips button.an{
  background:var(--acc);
  color:#04140c;
  border-color:var(--acc);
}
video{
  width:100%;
  border-radius:10px;
  background:#000;
  border:1px solid var(--line2);
  aspect-ratio:16/9;
}
.kpi{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--rad);
  padding:12px;
  margin-bottom:10px;
}
.kpi b{
  font-family:var(--mono);
  color:var(--acc);
  font-size:1.4rem;
  display:block;
}
.kpi small{
  color:var(--fg3);
  font-size:.72rem;
  font-family:var(--mono);
}
</style>
</head>
<body>

<header>
  <div class="kopf">
    <div class="logo">K</div>
    <h1>Kinolotse</h1>
    <span class="ver" id="ver">12</span>
  </div>
  <nav id="nav">
    <button data-page="suche" class="active">Suche</button>
    <button data-page="player">Player</button>
    <button data-page="download">Downloads</button>
    <button data-page="watchlist">Watchlist</button>
    <button data-page="verlauf">Verlauf</button>
    <button data-page="statistik">Statistik</button>
    <button data-page="diagnose">Diagnose</button>
    <button data-page="einstellungen">Einstellungen</button>
    <button data-page="info">Info</button>
  </nav>
</header>

<main id="haupt"></main>

<footer>
  <div class="kopfkonsole">
    <span class="p"><i></i>Agent</span>
    <span id="status">bereit</span>
    <span id="zaehler" style="color:var(--fg3)">0 Treffer</span>
    <button id="konsole-leeren">leeren</button>
  </div>
  <div id="konsole"></div>
</footer>

<div id="toast"></div>

<noscript>
  <div style="padding:16px">
    JavaScript ist deaktiviert. Ohne JavaScript läuft die App nicht.
  </div>
</noscript>

<template data-page="suche">
  <div id="banner">Starte den Selbsttest …</div>
  <div class="feld">
    <input type="text" id="q" placeholder="Titel, z. B. Inception" autocomplete="off" enterkeyhint="search">
    <button class="btn" id="start">Suchen</button>
  </div>
  <div class="chips" id="vorschlaege"></div>
  <div class="reihe">
    <button class="btn ghost klein" id="jahr-weg">Jahr entfernen</button>
    <button class="btn ghost klein" id="abbrechen" disabled>Abbrechen</button>
  </div>
  <div class="chips" id="genre-filter"></div>
  <div class="feld">
    <select id="sortierung">
      <option value="score">Sortierung: Relevanz</option>
      <option value="titel">Sortierung: Titel A–Z</option>
      <option value="titel2">Sortierung: Titel Z–A</option>
      <option value="jahr">Sortierung: Jahr</option>
      <option value="portal">Sortierung: Quelle</option>
    </select>
  </div>
  <div class="trenner"></div>
  <div id="treffer">
    <div class="leer">Noch keine Suche.</div>
  </div>
</template>

<template data-page="player">
  <h2>Player</h2>
  <p class="hinweis">
    MP4- und HLS-Links direkt abspielen. Über Teilen → „In Dateien sichern“ landet die Datei auf dem iPhone.
  </p>
  <div class="feld">
    <input type="url" id="p-url" placeholder="https://…/video.mp4">
    <button class="btn" id="p-start">Abspielen</button>
  </div>
  <video id="p-video" controls playsinline preload="metadata"></video>
  <div class="reihe" style="margin-top:10px">
    <button class="btn ghost klein" id="p-download">In Downloadliste</button>
    <button class="btn ghost klein" id="p-kopie">Link kopieren</button>
    <button class="btn ghost klein" id="p-stop">Stoppen</button>
  </div>
  <div id="p-status" class="hinweis">Kein Medium geladen.</div>
</template>

<template data-page="download">
  <h2>Downloads</h2>
  <p class="hinweis">
    „Datei speichern“ ist ein echter Link — Safari lädt direkt in „Dateien“. Klappt es nicht, im Player öffnen und über Teilen sichern.
  </p>
  <div class="reihe">
    <button class="btn ghost klein" id="dl-leeren">Liste leeren</button>
    <button class="btn ghost klein" id="dl-export">Als JSON exportieren</button>
  </div>
  <div id="dl-liste">
    <div class="leer">Keine Dateien.</div>
  </div>
</template>

<template data-page="watchlist">
  <h2>Watchlist</h2>
  <p class="hinweis">
    Gespeicherte Titel. „Alle prüfen“ startet für jeden Eintrag eine Suche.
  </p>
  <div class="feld">
    <input type="text" id="wl-ein" placeholder="Titel hinzufügen" autocomplete="off">
    <button class="btn" id="wl-add">Hinzufügen</button>
  </div>
  <div class="reihe">
    <button class="btn ghost klein" id="wl-alle">Alle prüfen</button>
    <button class="btn ghost klein" id="wl-leeren">Leeren</button>
  </div>
  <div id="wl-liste">
    <div class="leer">Watchlist ist leer.</div>
  </div>
</template>

<template data-page="verlauf">
  <h2>Verlauf</h2>
  <div class="reihe">
    <button class="btn ghost klein" id="vh-leeren">Verlauf löschen</button>
  </div>
  <div id="vh-liste">
    <div class="leer">Kein Verlauf.</div>
  </div>
</template>

<template data-page="statistik">
  <h2>Statistik</h2>
  <p class="hinweis">
    Zähler aus dieser Installation. Alles lokal, nichts verlässt das Gerät.
  </p>
  <div class="kpi">
    <b id="st-suchen">0</b>
    <small>Suchen</small>
  </div>
  <div class="kpi">
    <b id="st-treffer">0</b>
    <small>Treffer gesamt</small>
  </div>
  <div class="kpi">
    <b id="st-downloads">0</b>
    <small>Downloads</small>
  </div>
  <div class="kpi">
    <b id="st-tests">0</b>
    <small>bestandene Prüfungen</small>
  </div>
  <div class="kpi">
    <b id="st-quellen">0</b>
    <small>aktive Portale</small>
  </div>
  <div class="reihe">
    <button class="btn rot" id="st-reset">Zähler zurücksetzen</button>
  </div>
</template>

<template data-page="diagnose">
  <h2>Diagnose</h2>
  <p class="hinweis">
    Zuerst die Testsuite, dann die Live-Quellen. Die Berichtstabelle zeigt pro Quelle, was bei der letzten Suche passiert ist.
  </p>
  <div class="reihe">
    <button class="btn" id="tests-start">Testsuite starten</button>
    <button class="btn ghost" id="quellen-test">Quellen testen</button>
  </div>
  <div class="box">
    <h3>Testsuite</h3>
    <div class="balken"><i id="test-balken"></i></div>
    <div id="test-out"><div class="leer">Nicht gestartet.</div></div>
  </div>
  <div class="box">
    <h3>Letzte Suche</h3>
    <div id="bericht"><div class="leer">Noch keine Suche.</div></div>
  </div>
  <div class="box">
    <h3>Live-Quellen</h3>
    <div id="diag-out"><div class="leer">Nicht getestet.</div></div>
  </div>
  <div class="box">
    <h3>Lernbericht</h3>
    <div id="lern-out" class="hinweis">—</div>
  </div>
</template>

<template data-page="einstellungen">
  <h2>Einstellungen</h2>
  <label class="zeile">
    <span>Portale</span>
    <div id="portale-box"></div>
  </label>
  <label class="zeile">
    <span>Parallele Anfragen</span>
    <input type="number" id="e-parallel" min="1" max="10" value="4">
  </label>
  <label class="zeile">
    <span>Timeout je Anfrage (ms)</span>
    <input type="number" id="e-timeout" min="3000" max="45000" step="1000" value="12000">
  </label>
  <label class="zeile">
    <span>Mindest-Ähnlichkeit (0–1)</span>
    <input type="number" id="e-score" min="0" max="1" step="0.05" value="0.4">
  </label>
  <label class="zeile">
    <span>Maximale Treffer</span>
    <input type="number" id="e-max" min="3" max="60" value="20">
  </label>
  <label class="zeile">
    <span>Katalogtreffer anzeigen</span>
    <div><input type="checkbox" id="e-katalog" checked></div>
  </label>
  <div class="trenner"></div>
  <h3>KI (optional)</h3>
  <p class="hinweis">Ohne Schlüssel arbeitet der Agent regelbasiert.</p>
  <label class="zeile">
    <span>API-Schlüssel</span>
    <input type="password" id="e-key" placeholder="sk-…" autocomplete="off">
  </label>
  <label class="zeile">
    <span>Endpunkt</span>
    <input type="url" id="e-endpoint" placeholder="https://api.openai.com/v1/chat/completions">
  </label>
  <label class="zeile">
    <span>Modell</span>
    <input type="text" id="e-modell" placeholder="gpt-4o-mini">
  </label>
  <div class="reihe">
    <button class="btn" id="e-speichern">Speichern</button>
    <button class="btn ghost" id="e-export">Export</button>
    <button class="btn ghost" id="e-import">Import</button>
  </div>
  <div class="reihe">
    <button class="btn rot" id="e-reset">Alles zurücksetzen</button>
  </div>
  <textarea id="e-daten" placeholder="Export/Import-JSON"></textarea>
</template>

<template data-page="info">
  <h2>Info</h2>
  <div class="box">
    <h3>Aufbau</h3>
    <p class="hinweis">

  for (let i = 0; i < ss.length; i++) {
    ss[i].classList.toggle("on", ss[i].id === "page-" + n);
  }
  const kn = document.querySelectorAll("#nav button");
  for (let i = 0; i < kn.length; i++) {
    kn[i].classList.toggle("active", kn[i].getAttribute("data-page") === n);
  }
  try { window.scrollTo(0, 0); } catch (e) {}
  if (n === "download") zeichneDownloads();
  if (n === "watchlist") zeichneWatchlist();
  if (n === "verlauf") zeichneVerlauf();
  if (n === "statistik") zeichneStatistik();
  if (n === "diagnose") zeichneBericht();
  if (n === "einstellungen") fuelle();
  if (n === "suche") vorschlaege();
}

function verdrahten(n) {
  if (n === "suche") {
    if ($("start")) $("start").addEventListener("click", starte);
    if ($("q")) {
      $("q").addEventListener("keydown", function (e) {
        if (e.key === "Enter") starte();
      });
    }
    if ($("jahr-weg")) {
      $("jahr-weg").addEventListener("click", function () {
        const f = $("q");
        if (!f) return;
        f.value = f.value.replace(/[\(\[]?(19|20)\d{2}[\)\]]?/g, " ").replace(/\s+/g, " ").trim();
      });
    }
    if ($("abbrechen")) {
      $("abbrechen").addEventListener("click", function () {
        Z.abbruch = true;
        status("abbruch", true);
      });
    }
    if ($("sortierung")) {
      $("sortierung").addEventListener("change", function (e) {
        Z.sort = e.target.value;
        zeichne();
      });
    }
    vorschlaege();
    genrefilter();
  }
  if (n === "player") {
    if ($("p-start")) {
      $("p-start").addEventListener("click", function () {
        const u = $("p-url") ? $("p-url").value.trim() : "";
        if (!u) { meldung("Keine URL"); return; }
        spiele(u, "Video");
      });
    }
    if ($("p-download")) {
      $("p-download").addEventListener("click", function () {
        const u = $("p-url") ? $("p-url").value.trim() : "";
        if (u) zurDownload(u, "video.mp4");
      });
    }
    if ($("p-kopie")) {
      $("p-kopie").addEventListener("click", async function () {
        const u = $("p-url") ? $("p-url").value.trim() : "";
        if (!u) return;
        try {
          await navigator.clipboard.writeText(u);
          meldung("Kopiert");
        } catch (e) {
          meldung("Blockiert");
        }
      });
    }
    if ($("p-stop")) {
      $("p-stop").addEventListener("click", function () {
        const v = $("p-video");
        if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
        if ($("p-status")) $("p-status").textContent = "Gestoppt.";
      });
    }
  }
  if (n === "download") {
    if ($("dl-leeren")) {
      $("dl-leeren").addEventListener("click", function () {
        Z.downloads = [];
        zeichneDownloads();
      });
    }
    if ($("dl-export")) {
      $("dl-export").addEventListener("click", function () {
        const t = JSON.stringify(Z.downloads, null, 2);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([t], { type: "application/json" }));
        a.download = "downloads.json";
        a.click();
        meldung("Exportiert");
      });
    }
  }
  if (n === "watchlist") {
    if ($("wl-add")) $("wl-add").addEventListener("click", wlAdd);
    if ($("wl-ein")) {
      $("wl-ein").addEventListener("keydown", function (e) {
        if (e.key === "Enter") wlAdd();
      });
    }
    if ($("wl-alle")) $("wl-alle").addEventListener("click", wlAlle);
    if ($("wl-leeren")) {
      $("wl-leeren").addEventListener("click", function () {
        Store.setzen("watchlist", []);
        zeichneWatchlist();
      });
    }
  }
  if (n === "verlauf") {
    if ($("vh-leeren")) {
      $("vh-leeren").addEventListener("click", function () {
        Store.setzen("verlauf", []);
        zeichneVerlauf();
      });
    }
  }
  if (n === "statistik") {
    if ($("st-reset")) {
      $("st-reset").addEventListener("click", function () {
        Store.setzen("zaehler", {});
        zeichneStatistik();
        meldung("Zurückgesetzt");
      });
    }
  }
  if (n === "diagnose") {
    if ($("tests-start")) $("tests-start").addEventListener("click", testsStarten);
    if ($("quellen-test")) $("quellen-test").addEventListener("click", quellenTest);
  }
  if (n === "einstellungen") {
    if ($("e-speichern")) $("e-speichern").addEventListener("click", speichere);
    if ($("e-export")) $("e-export").addEventListener("click", exportieren);
    if ($("e-import")) $("e-import").addEventListener("click", importieren);
    if ($("e-reset")) $("e-reset").addEventListener("click", reset);
  }
}

function sortiere(l) {
  const a = l.slice();
  if (Z.sort === "titel") a.sort(function (x, y) { return x.titel.localeCompare(y.titel, "de"); });
  else if (Z.sort === "titel2") a.sort(function (x, y) { return y.titel.localeCompare(x.titel, "de"); });
  else if (Z.sort === "jahr") a.sort(function (x, y) { return (y.jahr || 0) - (x.jahr || 0); });
  else if (Z.sort === "portal") a.sort(function (x, y) { return x.portal.localeCompare(y.portal, "de"); });
  else a.sort(function (x, y) { return y.score - x.score; });
  return a;
}

async function starte() {
  if (Z.laeuft) { meldung("Läuft schon"); return; }
  const f = $("q");
  if (!f) return;
  const roh = f.value.trim();
  if (roh.length < 2) { meldung("Mindestens 2 Zeichen"); return; }
  Z.laeuft = true;
  Z.abbruch = false;
  Z.treffer = [];
  Z.zaehler = 0;
  Z.bericht = [];
  zaehle();
  if ($("abbrechen")) $("abbrechen").disabled = false;
  if ($("start")) $("start").disabled = true;
  const box = $("treffer");
  if (box) box.innerHTML = '<div class="leer">Suche läuft …</div>';
  status("suche", false);
  Store.zahl("suchen", 1);

  try {
    const q = await kiTitel(roh);

    if (S().katalog) {
      const k = katalog(q);
      Z.bericht.push({ quelle: "Katalog", ergebnis: k.length + " Treffer", ok: k.length > 0 });
      if (k.length) {
        Z.treffer = k.slice();
        Z.zaehler = k.length;
        zaehle();
        zeichne();
      }
    }

    const akt = PORTALE.filter(function (p) { return S().portale[p.id]; });
    if (akt.length) {
      const ant = await pool(akt, S().parallel, function (p) { return portalSuchen(p, q); });
      let live = [];
      ant.forEach(function (a) {
        if (!a) return;
        if (!a.ok) {
          Z.bericht.push({ quelle: a.p.name, ergebnis: a.fehler, ok: false });
          return;
        }
        const r = trefferAus(a, q);
        Z.bericht.push({ quelle: a.p.name, ergebnis: r.length + " Treffer", ok: r.length > 0 });
        live = live.concat(r);
      });
      if (live.length) {
        const best = new Map();
        live.forEach(function (x) {
          const k = norm(x.titel);
          const a = best.get(k);
          if (!a || x.score > a.score) best.set(k, x);
        });
        let l = Array.from(best.values());
        l.forEach(function (x) {
          x.score = Math.min(1, x.score * 0.75 + lernW(x.pid) * 0.25);
        });
        l = l.filter(function (x) { return x.score >= S().score; }).slice(0, S().max);
        Z.treffer = Z.treffer.concat(l);
        Z.zaehler = Z.treffer.length;
        zaehle();
        zeichne();
      }
    }

    if (!Z.treffer.length) {
      const g = Z.bericht.filter(function (b) { return !b.ok; })
        .map(function (b) { return b.quelle + ": " + b.ergebnis; })
        .slice(0, 4)
        .join(" · ");
      if (box) {
        box.innerHTML = '<div class="leer">Kein Treffer.<br><span style="font-size:.75rem">' +
          esc(g || "keine Quelle aktiv") + "</span></div>";
      }
    }

    Store.zahl("treffer", Z.treffer.length);
    const v = Store.lesen().verlauf || [];
    v.unshift({ q: q, n: Z.treffer.length, t: Date.now() });
    Store.setzen("verlauf", v.slice(0, 60));
  } catch (e) {
    if (box) box.innerHTML = '<div class="leer">Fehler: ' + esc(e.message) + "</div>";
  } finally {
    Z.laeuft = false;
    if ($("abbrechen")) $("abbrechen").disabled = true;
    if ($("start")) $("start").disabled = false;
    status("bereit", false);
  }
}

function zeichne() {
  const box = $("treffer");
  if (!box) return;
  box.innerHTML = "";
  let liste = Z.treffer;
  if (Z.genre) {
    liste = liste.filter(function (x) { return x.genre === Z.genre; });
  }
  liste = sortiere(liste);
  box.appendChild(el("div", "hinweis", liste.length + " Treffer"));
  const alle = el("button", "btn ghost klein", "Alle Quellen holen");
  alle.style.margin = "8px 0 12px";
  alle.addEventListener("click", function () {
    alle.disabled = true;
    const offen = Z.treffer.filter(function (x) { return !x.geprueft; });
    pool(offen, 3, function (x) { return quellen(x); }).then(function () {
      zeichne();
      meldung("Fertig");
    });
  });
  box.appendChild(alle);

  if (!liste.length) {
    box.appendChild(el("div", "leer", "Keine Treffer in diesem Filter."));
    return;
  }

  liste.forEach(function (t) {
    const k = el("div", "karte");
    k.appendChild(el("b", "", t.titel));
    const m = el("div", "meta");
    m.appendChild(el("span", "pille " + (t.score > 0.7 ? "gut" : t.score > 0.5 ? "mittel" : "schlecht"), Math.round(t.score * 100) + "%"));
    m.appendChild(document.createTextNode(t.portal + (t.genre ? " · " + t.genre : "")));
    k.appendChild(m);

    const r = el("div", "hoster");

    if (t.katalog) {
      const tn = t.titel.replace(/\s*\(\d{4}\)$/, "");
      const u = OFFEN[tn];
      if (u) {
        const a = document.createElement("a");
        a.className = "mp4";
        a.href = u;
        a.download = tn.replace(/\s+/g, "_") + ".mp4";
        a.rel = "noopener";
        a.appendChild(el("b", "", "MP4"));
        a.appendChild(document.createTextNode(" Datei speichern"));
        r.appendChild(a);

        const p = el("a", "", "Player");
        p.href = "#";
        p.addEventListener("click", function (ev) {
          ev.preventDefault();
          spiele(u, tn);
        });
        r.appendChild(p);

        const d = el("a", "", "in Downloads");
        d.href = "#";
        d.addEventListener("click", function (ev) {
          ev.preventDefault();
          zurDownload(u, tn + ".mp4");
        });
        r.appendChild(d);
      }
      PORTALE.filter(function (p) { return S().portale[p.id]; }).slice(0, 3).forEach(function (p) {
        const a = el("a");
        a.href = p.s(tn);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = p.name;
        r.appendChild(a);
      });
    } else {
      const s = el("a", "", "Seite");
      s.href = t.url;
      s.target = "_blank";
      s.rel = "noopener noreferrer";
      r.appendChild(s);

      if (t.hoster.length) {
        t.hoster.forEach(function (h) {
          const a = document.createElement("a");
          if (istVideo(h.url)) a.className = "mp4";
          a.href = h.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.appendChild(el("b", "", h.name));
          a.appendChild(document.createTextNode(istVideo(h.url) ? " Datei" : " öffnen"));
          r.appendChild(a);
        });
      } else if (t.geprueft) {
        r.appendChild(el("span", "pille schlecht", t.fehler ? "keine Hoster: " + t.fehler : "keine Hoster"));
      } else {
        const h = el("span", "lnk", "Quellen holen");
        h.addEventListener("click", async function () {
          h.textContent = "…";
          await quellen(t);
          zeichne();
        });
        r.appendChild(h);
      }
    }

    const w = el("span", "lnk", "+ Watchlist");
    w.addEventListener("click", function () { wlSpeichern(t.titel); });
    r.appendChild(w);

    k.appendChild(r);
    box.appendChild(k);
  });
}

  });

    pr.push({ a: "Portal", n: p.name, u: p.s("matrix") });
  });
  const erg = await pool(pr, 3, async function (p) {
    const r = await hole(p.u, { roh: p.a === "Proxy", timeout: 9000 });
    return { p: p, ok: r.ok, f: r.fehler };

  });
  Store.setzen("einstellungen", {

    timeout: Number($("e-timeout").value),
    score: Number($("e-score").value),
    max: Number($("e-max").value),
    katalog: $("e-katalog").checked,
    key: $("e-key").value.trim(),
    endpoint: $("e-endpoint").value.trim(),
    modell: $("e-modell").value.trim(),
    portale: po
  });
  meldung("Gespeichert");
  log("o", "Einstellungen gespeichert");
}

function exportieren() {
  $("e-daten").value = JSON.stringify(Store.lesen(), null, 2);
  meldung("Export im Feld");
}

function importieren() {
  try {
    Store.schreiben(JSON.parse($("e-daten").value));
    fuelle();
    meldung("Importiert");
  } catch (e) {
    meldung("Ungültiges JSON");
  }
}

function reset() {
  if (!confirm("Alle Daten löschen?")) return;
  Store.schreiben({});
  fuelle();
  meldung("Zurückgesetzt");
}
</script>

<script>
"use strict";

const Sup = {
  pruefe: function () {
    const b = [];
    if (!$("nav")) b.push("nav");
    if (!$("haupt")) b.push("main");
    if (!$("konsole")) b.push("konsole");
    const n = namen();
    if (!n.length) b.push("vorlagen");
    n.forEach(function (x) {
      if (!$("page-" + x)) b.push("seite " + x);
    });
    if (!Store.ok()) b.push("speicher");
    if (!document.querySelector(".page.on")) b.push("aktiv");
    return b;
  },
  rep: function () {
    namen().forEach(bauSeite);
    if (!document.querySelector(".page.on")) zeige("suche");
    const d = Store.lesen();
    if (!d.einstellungen) Store.setzen("einstellungen", {});
    if (!Array.isArray(d.watchlist)) Store.setzen("watchlist", []);
    if (!Array.isArray(d.verlauf)) Store.setzen("verlauf", []);
    if (typeof d.lern !== "object" || d.lern === null) Store.setzen("lern", {});
    if (typeof d.zaehler !== "object" || d.zaehler === null) Store.setzen("zaehler", {});
  },
  lauf: function () {
    const b = this.pruefe();
    if (!b.length) return true;
    log("w", "Supervisor: " + b.join(", "));
    this.rep();
    const b2 = this.pruefe();
    log(b2.length ? "e" : "o", b2.length ? "offen: " + b2.join(", ") : "alle Funktionen geprüft");
    return !b2.length;
  }
};

function banner(c, x) {
  const b = $("banner");
  if (!b) return;
  b.className = c || "";
  b.textContent = x;
}

async function selbsttest() {
  const ok = Sup.lauf();
  const sp = Store.ok();
  const nz = navigator.onLine !== false;
  const teile = [
    "Struktur " + (ok ? "ok" : "repariert"),
    "Seiten " + document.querySelectorAll(".page").length,
    "Speicher " + (sp ? "ok" : "Sitzung"),
    "Netz " + (nz ? "online" : "offline")
  ];
  if (ok && sp && nz) {
    banner("gut", "Selbsttest bestanden · " + teile.join(" · "));
    log("o", "Selbsttest bestanden");
  } else if (nz) {
    banner("warn", "Eingeschränkt · " + teile.join(" · "));
  } else {
    banner("schlecht", "Offline · " + teile.join(" · "));
  }
}

function start() {
  try {
    namen().forEach(bauSeite);
    Sup.rep();
    zeige("suche");
    fuelle();
    log("o", "Kinolotse " + APP.version + " gestartet");
    log("i", "Katalog " + KATALOG.length + " · Portale " + PORTALE.length + " · Hoster " + HOSTER.length);
    selbsttest();
    setInterval(function () {
      if (Sup.pruefe().length) Sup.rep();
    }, 120000);
    window.addEventListener("online", selbsttest);
    window.addEventListener("offline", function () {
      banner("schlecht", "Verbindung verloren.");
    });
  } catch (e) {
    log("e", "Startfehler: " + e.message);
    banner("schlecht", "Startfehler: " + e.message);
  }
}

document.addEventListener("click", function (e) {
  const b = e.target && e.target.closest ? e.target.closest("#nav button") : null;
  if (!b) return;
  const p = b.getAttribute("data-page");
  if (p) zeige(p);
});

if ($("konsole-leeren")) {
  $("konsole-leeren").addEventListener("click", function () {
    if ($("konsole")) $("konsole").innerHTML = "";
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", start);
} else {
  start();
}
</script>
</body>
</html>
